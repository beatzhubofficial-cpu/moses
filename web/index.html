<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f5">
    <title>Schoolhouse — School database</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="Schoolhouse dashboard home">
          <span class="brand-mark">S</span>
          <span>schoolhouse<span class="brand-period">.</span></span>
        </a>
        <div class="school-switcher">
          <span class="school-avatar">M</span>
          <span class="school-name"><strong>Moses School</strong><small>School database</small></span>
          <span class="switcher-chevron" aria-hidden="true">⌄</span>
        </div>
        <span class="nav-label">WORKSPACE</span>
        <nav class="navigation" aria-label="Main navigation">
          <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span>Overview</button>
          <button class="nav-item" data-page="students"><span class="nav-icon">♧</span>Students<span class="nav-count" id="student-nav-count">—</span></button>
          <button class="nav-item" data-page="courses"><span class="nav-icon">▤</span>Courses</button>
          <button class="nav-item" data-page="results"><span class="nav-icon">▥</span>Results</button>
          <button class="nav-item" data-page="attendance"><span class="nav-icon">◷</span>Attendance</button>
        </nav>
        <div class="sidebar-bottom">
          <span class="connection-dot"></span>
          <span>Connected to local database</span>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Schoolhouse</span><span class="breadcrumb-separator">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-actions">
            <span class="live-indicator"><span class="live-dot"></span>Live data</span>
            <button class="icon-button" id="refresh-button" aria-label="Refresh dashboard" title="Refresh dashboard">↻</button>
            <span class="profile-avatar" title="School administrator">SA</span>
          </div>
        </header>

        <div class="page-container">
          <section class="page-heading">
            <div>
              <p class="eyebrow" id="current-date"></p>
              <h1 id="page-title">Good day <span class="heading-wave">✳</span></h1>
              <p class="page-description" id="page-description">Here’s what’s happening at your school today.</p>
            </div>
            <button class="primary-button" id="view-students-button"><span aria-hidden="true">＋</span> View students</button>
          </section>

          <div class="notice" id="notice" role="status" hidden></div>
          <div id="page-content" aria-live="polite">
            <div class="loading-state"><span class="spinner"></span>Loading your school data…</div>
          </div>
          <footer class="page-footer">
            <span>Schoolhouse <span class="footer-dot">·</span> Local school database</span>
            <span id="last-updated">Connecting…</span>
          </footer>
        </div>
      </main>
    </div>
  </body>
</html>
